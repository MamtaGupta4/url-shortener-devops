<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>🔗 URL Shortener</h1>

<form action="/shorten" method="POST">

<input
type="url"
name="long_url"
placeholder="Enter URL"
required>

<button type="submit">
Shorten URL
</button>

</form>

</div>

</body>
</html>
